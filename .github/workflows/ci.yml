# CI — every PR and every push to main must type-check, pass the pricing
# unit tests, and produce a full production build (including the Puppeteer
# prerender, which already runs --no-sandbox) BEFORE it can auto-deploy
# via Railway. Until this workflow existed, nothing gated merges at all.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests (pricing engine)
        run: npm test

      # Catches internal links pointing at paths no route serves. TypeScript
      # cannot check a string against a wouter route table, so this class of bug
      # ships silently — #46 found two dead links by accident, and this run
      # found six more in the checkout consent copy.
      - name: Route audit (dead internal links)
        run: npm run check:routes

      # The site ships four locales, but a string typed into a component
      # renders English whatever language the visitor chose — and key-parity
      # checks can't see it, because the locale files are complete and the
      # component simply never asks them. That is how the Sinai guide kept
      # telling Spanish, French and German readers things the English page had
      # already corrected. A ratchet, not a gate: known offenders are pinned in
      # scripts/i18n-baseline.json, and the build fails on a new one or on a
      # stale pin, so the count can only go down.
      - name: i18n audit (hardcoded English)
        run: npm run check:i18n

      # Full production build: pricing snapshot (falls back without
      # DATABASE_URL by design), vite build + prerender, sitemap, server
      # bundle. Catches build-only breakage before Railway does.
      - name: Production build
        run: npm run build
