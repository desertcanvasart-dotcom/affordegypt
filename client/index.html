<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Consent Mode v2 defaults.
         MUST stay above the Tag Manager and gtag loaders below: consent state
         has to exist before any tag initialises, or the tag sets cookies once
         before the first update lands and the denial is meaningless.

         Everything non-essential defaults to denied, for every visitor rather
         than only the EEA. Regional defaults are supported, but a single
         global default has no geo edge cases to get wrong, and the banner is
         shown to everyone anyway.

         Tags are deliberately NOT blocked. Under Consent Mode they load and
         send cookieless pings while denied, which is what preserves Google Ads
         conversion modelling — the property feeds Ads conversion imports, so
         blocking the scripts outright would cost measurement that denial alone
         does not.

         A previously stored choice is replayed into the default so a
         consenting returning visitor is not measured as denied for the first
         500ms of every page load. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function () {
        var granted = false;
        try { granted = localStorage.getItem('ae:cookie-consent') === 'granted'; } catch (e) {}
        var state = granted ? 'granted' : 'denied';
        gtag('consent', 'default', {
          ad_storage: state,
          ad_user_data: state,
          ad_personalization: state,
          analytics_storage: state,
          functionality_storage: 'granted',
          security_storage: 'granted',
          wait_for_update: 500
        });
      })();
    </script>
    <!-- End Google Consent Mode v2 defaults -->

    <!-- Google Tag Manager.
         Google's stock snippet ends `f.parentNode.insertBefore(j, f)`, which
         places the loader before the FIRST script in the document — now the
         consent defaults above. At runtime that is harmless, because the
         inline consent script has already executed by then. In the prerendered
         snapshot it is not: Puppeteer serialises the injected tag where it
         sits, so the built HTML shipped gtm.js ahead of the consent block and
         a fresh browser parsed them in that order.

         Appending to <head> instead is functionally identical and keeps the
         loader after the consent defaults in both the live DOM and the
         snapshot. Do not restore insertBefore. -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;d.head.appendChild(j);
    })(window,document,'script','dataLayer','GTM-WJ597P5W');</script>
    <!-- End Google Tag Manager -->
    
    <!-- Google Analytics. G-MWY0T7465M is duplicated in client/src/lib/analytics.ts,
         which handles SPA route changes and Google Ads conversions — keep both in
         sync. This tag only fires the initial pageview; wouter navigations do not
         reload the document, so they are reported from analytics.ts instead. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MWY0T7465M"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-MWY0T7465M');
    </script>
    <!-- End Google Analytics -->
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Afford Egypt - Budget Travel Egypt with Transparent Pricing</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png">
    <meta name="theme-color" content="#0d9488">
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WJ597P5W"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
